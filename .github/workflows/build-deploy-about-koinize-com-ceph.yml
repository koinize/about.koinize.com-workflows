name: Deploy about.koinize.com to Ceph

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install AWS CLI
      # -------------------------
      # Configure AWS credentials
      # -------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      # 3. Deploy to Ceph
      - name: Deploy to Ceph bucket (about-koinize-com)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          AWS_ENDPOINT_URL: ${{ vars.AWS_ENDPOINT_URL }}
        run: |
          aws s3 sync . s3://about-koinize-com \
            --endpoint-url $AWS_ENDPOINT_URL \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"

      # 4. Purge Bunny CDN cache
      - name: Purge Bunny CDN cache
        if: success()
        run: |
          curl -X POST "https://api.bunny.net/purge" \
            -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}" \
            -H "Content-Length: 0"
